apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api
  namespace: fraud
  labels:
    app: fraud-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: fraud-api
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: api
          image: fraud-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          envFrom:
            - configMapRef:
                name: fraud-api-config
          startupProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
