name: fraud-detection-tabular

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: fraud-detection-tabular/api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 20
      start_period: 20s

  producer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.streaming
      target: producer
    image: fraud-detection-tabular/producer
    restart: "no"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC: transactions
      RATE: ${RATE:-200}
      MAX_ROWS: ${MAX_ROWS:-}
    volumes:
      - ../data/processed/transactions.parquet:/app/data/processed/transactions.parquet:ro
      - ../data/processed/meta.json:/app/data/processed/meta.json:ro
    depends_on:
      kafka:
        condition: service_healthy
      consumer:
        condition: service_healthy

  consumer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.streaming
      target: consumer
    image: fraud-detection-tabular/consumer
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC: transactions
      API_URL: http://api:8000
      SQLITE_PATH: /data/stream.db
    volumes:
      - stream_store:/data
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/healthy -mmin -1 2>/dev/null)\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      kafka:
        condition: service_healthy
      api:
        condition: service_healthy

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    image: fraud-detection-tabular/dashboard
    environment:
      APP_MODE: local
      SQLITE_PATH: /data/stream.db
    volumes:
      - stream_store:/data
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fraud-api.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  stream_store:
    name: fraud-detection-tabular-stream-store
